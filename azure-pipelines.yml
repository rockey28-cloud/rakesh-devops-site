# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    echo "================================"
    echo "Rakesh DevOps CI/CD Pipeline"
    echo "================================"
    echo "Build started"
  displayName: 'Start Pipeline'

- script: |
    echo "Checking website..."
    cat index.html
  displayName: 'Check Website'

- task: SSH@0
  displayName: 'Debug Azure VM Connection'
  inputs:
    sshEndpoint: 'Azure-VM-SSH'
    runOptions: 'commands'
    commands: |
      echo "===== CURRENT USER ====="
      whoami

      echo "===== CURRENT DIRECTORY ====="
      pwd

      echo "===== HOME DIRECTORY ====="
      echo "HOME=$HOME"

      echo "===== CURRENT DIRECTORY CONTENTS ====="
      ls -la

      echo "===== AZUREUSER HOME ====="
      ls -la /home/azureuser

      echo "===== WEBSITE DIRECTORY ====="
      ls -la /home/azureuser/rakesh-devops-site

      echo "===== GIT DIRECTORY ====="
      ls -la /home/azureuser/rakesh-devops-site/.git

      echo "===== GIT STATUS ====="
      cd /home/azureuser/rakesh-devops-site
      git status