trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    echo "================================"
    echo "Rakesh DevOps CI/CD Pipeline"
    echo "================================"
    echo "Build started"
  displayName: 'Start Pipeline'

- script: |
    echo "===== CHECK WEBSITE ====="
    echo "Website content:"
    cat index.html
  displayName: 'Check Website'

- task: SSH@0
  displayName: 'Deploy to Azure VM'
  inputs:
    sshEndpoint: 'Azure-VM-SSH'
    runOptions: 'commands'
    commands: |
      echo "===== CONNECTED TO AZURE VM ====="
      whoami
      hostname

      echo "===== GO TO PROJECT DIRECTORY ====="
      cd /home/azureuser/rakesh-devops-site

      echo "===== PULL LATEST CODE FROM GITHUB ====="
      git pull origin main

      echo "===== CURRENT WEBSITE VERSION ====="
      grep "<h1>" index.html

      echo "===== CHECK NGINX ====="
      sudo systemctl is-active nginx

      echo "===== TEST WEBSITE ====="
      curl -s http://localhost

      echo "===== DEPLOYMENT SUCCESSFUL ====="