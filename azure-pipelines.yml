trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    echo "================================"
    echo "Rakesh DevOps CI/CD Pipeline"
    echo "================================"
    echo "Build started"
  displayName: 'Start Pipeline'

- script: |
    echo "===== CHECK WEBSITE ====="
    echo "Website content:"
    cat index.html
  displayName: 'Check Website'

- task: SSH@0
  displayName: 'Deploy to Azure VM'
  inputs:
    sshEndpoint: 'Azure-VM-SSH'
    runOptions: 'commands'
    commands: |
      echo "===== CONNECTED TO AZURE VM ====="
      whoami
      hostname

      echo "===== CREATE WEBSITE DIRECTORY ====="
      mkdir -p /home/azureuser/rakesh-devops-site

      echo "===== DEPLOYMENT DIRECTORY ====="
      ls -la /home/azureuser/rakesh-devops-site

      echo "===== DEPLOYMENT READY ====="
      echo "Azure VM connection successful"